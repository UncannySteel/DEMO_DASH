<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Onextap</title>
<meta name="description" content="Talk to the people building Onextap: send feedback, report a job board that fights back, or ask a question.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<!-- The landing page's Contact page (../demo), copied from its source into
     site/ and run without a build: its styles, in the build's cascade order,
     and its two libraries from vendor/. -->
<link rel="stylesheet" href="../site/shared/styles/tokens.css">
<link rel="stylesheet" href="../site/shared/styles/base.css">
<link rel="stylesheet" href="../site/shared/styles/layout.css">
<link rel="stylesheet" href="../site/shared/styles/buttons.css">
<link rel="stylesheet" href="../site/features/cursor/cursor.css">
<link rel="stylesheet" href="../site/features/hud/hud.css">
<link rel="stylesheet" href="../site/shared/styles/dialog.css">
<link rel="stylesheet" href="../site/pages/sub-page.css">
<link rel="stylesheet" href="../site/features/feedback/feedback.css">
<link rel="stylesheet" href="../site/pages/contact/contact.css">
<script type="importmap">
{
  "imports": {
    "gsap": "../vendor/gsap/index.js",
    "gsap/ScrollTrigger": "../vendor/gsap/ScrollTrigger.js",
    "lenis": "../vendor/lenis/lenis.mjs"
  }
}
</script>
</head>
<body>

<!-- A company page: the landing page's cursor and header row, over an
     ordinary scrolling page (site/pages/sub-page.js). Each [data-mount]
     placeholder is replaced by that feature's markup. -->
<div data-mount="cursor"></div>
<div data-mount="hud"></div>
<div class="sub-bar" data-header-row aria-hidden="true"></div>

<div class="sub" data-page>
  <main id="top">
    <div data-mount="contact"></div>
  </main>
  <div data-mount="page-foot"></div>
</div>

<div data-mount="feedback"></div>

<script type="module" src="../site/pages/contact/contact.js"></script>
</body>
</html>
